name: binaires

# Les binaires de Lydite, construits ici par GitHub Actions et attestés (provenance signée) : c'est ce que le catalogue
# de Hermes demande de tout binaire natif (règle 17). Il ne part que pour une étiquette `v*` ou à la main ; la CI
# ordinaire (ci.yml) ne le déclenche jamais. Il est écrit pour le dépôt public : l'attestation d'un dépôt privé
# demande un forfait que le dépôt interne n'a pas.
#
# Vérifier un binaire téléchargé :  gh attestation verify <fichier> --repo <proprietaire>/<depot>

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # La commande s'appelle `lydite`, comme le paquet Cargo et le binaire construit (« Kraken », son nom interne
  # d'avant, est déjà pris par l'outil d'une plateforme de cryptomonnaies).
  COMMANDE: lydite

permissions:
  contents: read

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cible: linux-x86_64, binaire: lydite, archive: tar.gz }
          - { os: windows-latest, cible: windows-x86_64, binaire: lydite.exe, archive: zip }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      # Une étiquette nomme la version de Cargo.toml, ou rien ne se construit. Un Cargo.lock resté en arrière est
      # arrêté juste après, par `cargo test --locked`.
      - name: Comparer la version à l'étiquette
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(cargo pkgid)"
          version="${version##*[#@]}"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not name the version of Cargo.toml (v$version)."
            exit 1
          fi
      - run: cargo test --locked
      - run: cargo build --release --locked
      # Le filtre réseau du mur natif, lydite-reseau, ne se construit que sous Linux ; il est livré à côté de lydite.
      - name: Construire le filtre réseau (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --manifest-path reseau/Cargo.toml -- --include-ignored
          cargo build --release --locked --manifest-path reseau/Cargo.toml
      - name: Emballer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nom="${COMMANDE}-${GITHUB_REF_NAME//\//-}-${{ matrix.cible }}"
          mkdir -p "dist/$nom"
          cp "target/release/${{ matrix.binaire }}" "dist/$nom/${COMMANDE}"
          cp reseau/target/release/lydite-reseau "dist/$nom/"
          cp LICENSE README.md "dist/$nom/"
          tar -czf "dist/$nom.tar.gz" -C dist "$nom"
          (cd dist && sha256sum "$nom.tar.gz" > "$nom.tar.gz.sha256")
          rm -rf "dist/$nom"
      - name: Emballer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nom = "$env:COMMANDE-$($env:GITHUB_REF_NAME -replace '/', '-')-${{ matrix.cible }}"
          New-Item -ItemType Directory -Force "dist/$nom" | Out-Null
          Copy-Item "target/release/${{ matrix.binaire }}" "dist/$nom/$env:COMMANDE.exe"
          Copy-Item LICENSE, README.md "dist/$nom/"
          Compress-Archive -Path "dist/$nom" -DestinationPath "dist/$nom.zip"
          $hash = (Get-FileHash "dist/$nom.zip" -Algorithm SHA256).Hash.ToLower()
          # Un saut de ligne LF, comme `sha256sum` sous Linux : `sha256sum -c` lit ce fichier partout.
          Set-Content -Path "dist/$nom.zip.sha256" -Value "$hash  $nom.zip`n" -NoNewline -Encoding ascii
          Remove-Item -Recurse -Force "dist/$nom"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.${{ matrix.archive }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.cible }}
          path: dist/*
          if-no-files-found: error

  publier:
    # Le push d'une étiquette seulement : un lancement à la main construit et atteste, sans rien publier, même lancé
    # sur une étiquette.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # `--verify-tag` : une étiquette retirée pendant la construction n'est pas recréée sur la branche par défaut.
      - name: Attacher à la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag
