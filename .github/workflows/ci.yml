name: ci

# Linux et Windows à chaque PR, et les essais de la garde : un dépôt public ne paie pas ses minutes. Rien sur un push
# vers main : la PR vient d'y être vérifiée. Sur une branche sans PR : gh workflow run ci.yml --ref <branche>.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une nouvelle tête sur une PR annule le run de l'ancienne.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
  # Les essais de la garde : un nom à eux, pour ne pas se confondre avec le workflow garde dans les contrôles d'une PR.
  essais-garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -I .github/garde_test.py
  # ruff relit le Python du dépôt (le plugin hermes/ et la garde de .github/) et vérifie sa mise en forme, à une version
  # épinglée ; rien ne s'installe ailleurs que sur le runner.
  ruff:
    runs-on: ubuntu-latest
    env:
      RUFF: ruff==0.17.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pipx run --spec "$RUFF" ruff check hermes .github
      - run: pipx run --spec "$RUFF" ruff format --check --diff hermes .github
