name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Une nouvelle tête sur une PR annule le run de l'ancienne ; chaque push sur main a son groupe à lui, rien ne l'annule.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifier:
    strategy:
      fail-fast: false
      matrix:
        # Linux seul sur main : la PR vient de passer sous les deux systèmes.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
