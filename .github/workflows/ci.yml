name: ci

# Linux et Windows à chaque PR, et les essais de la garde : un dépôt public ne paie pas ses minutes. Rien sur un push
# vers main : la PR vient d'y être vérifiée. Sur une branche sans PR : gh workflow run ci.yml --ref <branche>.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une nouvelle tête sur une PR annule le run de l'ancienne.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# `cargo test --no-fail-fast` : un binaire de tests rouge n'arrête pas les suivants, et une PR montre d'un coup tous ses
# échecs, au lieu d'un par tour de CI (vu sur les PR 23, 24, 28 et 29 : une CI Windows rouge par échec caché).
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --check
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings
      # reseau/ (lydite-reseau, le filtre réseau du mur natif) ne se construit que sous Linux. Ses essais du vrai socket
      # Unix, éteints par défaut, se jouent ici.
      - run: cargo fmt --check --manifest-path reseau/Cargo.toml
      - run: cargo test --no-fail-fast --manifest-path reseau/Cargo.toml -- --include-ignored
      - run: cargo clippy --all-targets --manifest-path reseau/Cargo.toml -- -D warnings
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --check
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings
  # Les essais de la garde et du contrôle de fusion : un nom à eux, pour ne pas se confondre avec les workflows garde et
  # tete dans les contrôles d'une PR.
  essais-garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -I .github/garde_test.py
      - run: python3 -I .github/tete_test.py
  # ruff relit le Python du dépôt (le plugin hermes/ et la garde de .github/) et vérifie sa mise en forme, à une version
  # épinglée ; rien ne s'installe ailleurs que sur le runner.
  ruff:
    runs-on: ubuntu-latest
    env:
      RUFF: ruff==0.17.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pipx run --spec "$RUFF" ruff check hermes .github
      # La mise en forme se vérifie même quand le lint a rougi : un passage dit les deux.
      - if: ${{ !cancelled() }}
        run: pipx run --spec "$RUFF" ruff format --check --diff hermes .github
