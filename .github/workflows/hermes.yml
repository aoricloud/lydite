name: hermes

# Le plugin Hermes (dossier hermes/) : ses tests, sans rien installer (bibliothèque standard seulement).
# `hermes plugins validate` se joue à la main sur une machine qui a Hermes : voir hermes/README.md.

on:
  push:
    branches: [main]
    paths: ["hermes/**", ".github/workflows/hermes.yml"]
  pull_request:
    paths: ["hermes/**", ".github/workflows/hermes.yml"]

permissions:
  contents: read

jobs:
  tester:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error -m unittest discover -s hermes/tests -t hermes
