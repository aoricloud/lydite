name: garde

# La garde de ce que le dépôt publie : à chaque PR et à chaque push sur main, elle cherche les mots du secret GARDE (un
# par ligne) et quelques motifs génériques dans les noms neufs des fichiers changés, les lignes ajoutées (par le diff
# net et par chaque commit), les commits, la branche, le titre et le corps (.github/garde.py). Elle nomme le lieu,
# jamais le mot. La PR d'un fork ne lit que les motifs : sa sortie est publique, et rougir sur un mot deviné le
# confirmerait. Un fichier binaire ne passe que si .github/binaires.txt porte son chemin et son empreinte.
#
# pull_request_target : le workflow, son script et la liste des binaires viennent de la branche de base, qu'une PR ne
# peut pas changer pour elle-même. Le code de la PR n'est jamais extrait ni lancé ; il ne se lit que par l'API, comme
# du texte.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Une nouvelle tête sur une PR annule le run de l'ancienne ; chaque push sur main a le sien.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  garde:
    runs-on: ubuntu-latest
    steps:
      # github.sha : la tête de la branche de base sous pull_request_target, le commit poussé sous push. Jamais la PR.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the change from the API
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          NUMERO: ${{ github.event.pull_request.number }}
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.event.after }}
        run: |
          d="$RUNNER_TEMP/garde"
          mkdir -p "$d"
          champs='{sha, m: .commit.message, a: .commit.author, c: .commit.committer} | @json'
          if [ -n "$NUMERO" ]; then
            change="repos/$DEPOT/pulls/$NUMERO"
            attendus=$(gh api "$change" --jq .commits) || attendus=inconnu
            # Le titre, le corps et la branche par l'API, dans un fichier : passés par env:, le journal les afficherait.
            gh api "$change" --jq '{titre: .title, corps: (.body // ""), branche: .head.ref}' > "$d/pr.json" \
              || echo pr >> "$d/erreur"
            gh api --paginate "$change/commits?per_page=100" --jq ".[] | $champs" > "$d/commits.jsonl" \
              || echo commits >> "$d/erreur"
            # L'id de blob de la version finale de chaque fichier : la garde y reconnaît celle d'un binaire approuvé.
            gh api --paginate "$change/files?per_page=100" --jq '.[] | {nom: .filename, sha} | @json' \
              > "$d/fichiers.jsonl" || echo fichiers >> "$d/erreur"
          else
            change="repos/$DEPOT/compare/$AVANT...$APRES"
            attendus=$(gh api "$change?per_page=1" --jq .total_commits) || attendus=inconnu
            gh api --paginate "$change?per_page=100" --jq ".commits[] | $champs" > "$d/commits.jsonl" \
              || echo commits >> "$d/erreur"
            # raccourci : la comparaison ne nomme que 300 fichiers ; un binaire au-delà ne se lit pas, et la garde rougit
            gh api "$change" --jq '.files[]? | {nom: .filename, sha} | @json' > "$d/fichiers.jsonl" \
              || echo fichiers >> "$d/erreur"
          fi
          # Autant de commits que l'API en annonce : celle d'une PR n'en rend que 250.
          [ "$(wc -l < "$d/commits.jsonl")" = "$attendus" ] || echo "commits: $attendus attendus" >> "$d/erreur"
          # Le diff net, puis celui de chaque commit : un mot ajouté puis retiré reste dans l'histoire que main reçoit.
          { gh api "$change" -H 'Accept: application/vnd.github.diff' \
            && gh api "$change" -H 'Accept: application/vnd.github.patch'; } > "$d/diff" \
            || echo diff >> "$d/erreur"
      - name: Look for the words of the list and the generic patterns
        env:
          GARDE: >-
            ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
            && secrets.GARDE || '' }}
          LISTE: >-
            ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
            && 'depot' || 'fork' }}
        run: python3 -I .github/garde.py "$RUNNER_TEMP/garde"
