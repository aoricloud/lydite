name: lydite
version: 0.4.0
description: "Hand a GitHub issue or an objective, plus the test that proves it, to a Lydite wave from the chat: isolated workers, the proof replayed by Lydite itself, and a pull request that states what was proved."
author: aoricloud
license: MIT
homepage: https://github.com/aoricloud/lydite
requires_hermes: ">=0.23.0"
provides_tools:
  - lydite_lancer
  - lydite_etat
  - lydite_lecons
  - lydite_plan
  - lydite_findings
provides_hooks:
  - pre_tool_call
config_schema:
  binaire:
    type: str
    label: "Lydite binary"
    description: "Absolute path of the Lydite binary already installed on this machine. Empty: the first `lydite` found on PATH (check that it is this tool and not another program of the same name)."
  profil:
    type: str
    default: claude
    label: "Default profile"
    description: "Name of the Lydite profile that sets the workers' model, wall and provider. It must have been accepted by a human with `lydite accepter <name>`."
  cle_nom:
    type: str
    label: "Provider key variable"
    description: "Name of the environment variable that the profile's `cle` line names (e.g. a DeepSeek key). Empty: no key is passed, the workers use the Claude Code login of the account."
  cle:
    type: secret
    env: LYDITE_CLE_FOURNISSEUR
    description: "The provider key named by `cle_nom`. Read through Hermes and handed only to the Lydite process that runs the workers."
